<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语音识别控制台</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --border:    #2a2d3a;
    --primary:   #4f8ef7;
    --primary-d: #3a70d4;
    --success:   #3ecf8e;
    --danger:    #f76f6f;
    --warn:      #f7b84f;
    --text:      #e2e4ef;
    --muted:     #6b7094;
    --radius:    10px;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: .02em;
    color: #fff;
    margin-bottom: 24px;
  }

  /* ─── Layout ─────────────────────────────────────────────── */
  .layout {
    width: 100%;
    max-width: 860px;
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: auto 1fr;
    gap: 16px;
  }
  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ─── Card ──────────────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }
  .card-title {
    font-size: .75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* ─── Connection bar ────────────────────────────────────── */
  .conn-bar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
  }
  .conn-bar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    color: var(--text);
    font-size: .875rem;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    outline: none;
  }
  .conn-bar input:focus { border-color: var(--primary); }

  /* ─── Dot indicator ─────────────────────────────────────── */
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background .3s;
  }
  .dot.connected  { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .dot.connecting { background: var(--warn);    animation: pulse 1s infinite; }
  .dot.error      { background: var(--danger);  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: .3; }
  }

  /* ─── Buttons ──────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: 7px;
    padding: 9px 16px;
    font-size: .875rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    user-select: none;
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .38; cursor: not-allowed; transform: none; }

  .btn-primary  { background: var(--primary);  color: #fff; }
  .btn-primary:hover:not(:disabled)  { background: var(--primary-d); }
  .btn-success  { background: var(--success);  color: #0a2a1e; }
  .btn-success:hover:not(:disabled)  { filter: brightness(1.1); }
  .btn-danger   { background: var(--danger);   color: #fff; }
  .btn-danger:hover:not(:disabled)   { filter: brightness(1.1); }
  .btn-ghost    { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-ghost:hover:not(:disabled)    { border-color: var(--text); color: var(--text); }

  .btn-connect    { min-width: 90px; }
  .btn-sm         { padding: 5px 10px; font-size: .8rem; }

  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
  }
  .btn-row .btn { flex: 1; }

  /* ─── State badge ──────────────────────────────────────── */
  .state-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: .8rem;
    font-weight: 600;
    border: 1px solid transparent;
    transition: all .3s;
  }
  .state-stopped   { background:#1e1e28; border-color: var(--border); color: var(--muted); }
  .state-idle      { background:#1a2b1e; border-color: var(--success); color: var(--success); }
  .state-listening { background:#1a2240; border-color: var(--primary); color: var(--primary);
                     animation: glow 1.5s ease-in-out infinite; }

  @keyframes glow {
    0%,100% { box-shadow: none; }
    50%      { box-shadow: 0 0 12px rgba(79,142,247,.4); }
  }

  /* ─── Waveform animation ────────────────────────────────── */
  .wave {
    display: none;
    align-items: flex-end;
    gap: 3px;
    height: 20px;
  }
  .wave.active { display: flex; }
  .wave span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: var(--primary);
    animation: wave-bar 1s ease-in-out infinite;
  }
  .wave span:nth-child(1) { animation-delay: 0s;    height: 6px; }
  .wave span:nth-child(2) { animation-delay: .15s;  height: 12px; }
  .wave span:nth-child(3) { animation-delay: .3s;   height: 18px; }
  .wave span:nth-child(4) { animation-delay: .45s;  height: 12px; }
  .wave span:nth-child(5) { animation-delay: .6s;   height: 6px; }

  @keyframes wave-bar {
    0%,100% { transform: scaleY(1); }
    50%      { transform: scaleY(.3); }
  }

  /* ─── Wake word flash ───────────────────────────────────── */
  .wake-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 8px;
    background: #1a2a1e;
    border: 1px solid var(--border);
    font-size: .85rem;
    transition: all .3s;
    margin-bottom: 14px;
  }
  .wake-indicator.flash {
    background: #1a3d1e;
    border-color: var(--success);
    animation: flash-in .6s ease-out;
  }
  @keyframes flash-in {
    0%   { background: #2a7a3e; border-color: var(--success); }
    100% { background: #1a3d1e; border-color: var(--success); }
  }
  .wake-icon { font-size: 1.1rem; }

  /* ─── Config panel ───────────────────────────────────────── */
  .config-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .config-row label {
    font-size: .8rem;
    color: var(--muted);
    width: 80px;
    flex-shrink: 0;
  }
  .config-row input[type=text],
  .config-row input[type=number],
  .config-row select {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 9px;
    color: var(--text);
    font-size: .8rem;
    outline: none;
  }
  .config-row input:focus,
  .config-row select:focus { border-color: var(--primary); }
  .config-row input[type=range] { flex: 1; accent-color: var(--primary); }
  .range-val { font-size: .8rem; color: var(--muted); min-width: 28px; text-align: right; }

  /* ─── Transcript area ───────────────────────────────────── */
  .transcript-wrap {
    grid-row: 2;
    grid-column: 2;
    display: flex;
    flex-direction: column;
    min-height: 340px;
  }
  @media (max-width: 640px) {
    .transcript-wrap { grid-column: 1; grid-row: auto; }
  }

  .transcript-box {
    flex: 1;
    background: var(--bg);
    border-radius: 8px;
    padding: 14px;
    font-size: .9rem;
    line-height: 1.7;
    overflow-y: auto;
    min-height: 160px;
    max-height: 280px;
    border: 1px solid var(--border);
  }
  .transcript-box .entry {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .transcript-box .entry .ts {
    color: var(--muted);
    font-size: .75rem;
    flex-shrink: 0;
    padding-top: 2px;
    font-family: monospace;
  }
  .transcript-box .entry .txt { flex: 1; }
  .entry.partial .txt { color: var(--muted); font-style: italic; }
  .entry.final   .txt { color: var(--text); font-weight: 500; }

  .partial-live {
    color: var(--muted);
    font-style: italic;
    padding: 4px 0;
    min-height: 1.5em;
  }

  .transcript-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 8px;
  }

  /* ─── Event log ─────────────────────────────────────────── */
  .log-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: .75rem;
    overflow-y: auto;
    max-height: 160px;
    margin-top: 10px;
    color: var(--muted);
  }
  .log-box .log-line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-all; }
  .log-box .log-line.ev-wake_word      { color: var(--success); }
  .log-box .log-line.ev-transcript     { color: #7ecfff; }
  .log-box .log-line.ev-error          { color: var(--danger); }
  .log-box .log-line.ev-listening_start{ color: var(--primary); }

  /* ─── Send cmd ──────────────────────────────────────────── */
  .raw-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .raw-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    font-family: monospace;
    font-size: .8rem;
    outline: none;
  }
  .raw-row input:focus { border-color: var(--primary); }

  /* ─── Scroll to bottom ──────────────────────────────────── */
  .scroll-anchor { height: 1px; }
</style>
</head>
<body>

<h1>🎙️ 语音识别控制台</h1>

<div class="layout">

  <!-- Connection bar -->
  <div class="card conn-bar">
    <div class="dot" id="dot"></div>
    <input id="wsUrl" type="text" value="ws://127.0.0.1:8765" spellcheck="false">
    <button class="btn btn-primary btn-connect" id="btnConnect" onclick="toggleConnect()">连接</button>
  </div>

  <!-- Left panel -->
  <div style="display:flex;flex-direction:column;gap:16px;">

    <!-- Status & controls -->
    <div class="card">
      <div class="card-title">状态与控制</div>

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <span class="state-badge state-stopped" id="stateBadge">
          <span id="stateDot">⬤</span> <span id="stateText">未连接</span>
        </span>
        <div class="wave" id="wave">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="wake-indicator" id="wakeIndicator">
        <span class="wake-icon">👂</span>
        <span id="wakeText">等待唤醒词...</span>
      </div>

      <div class="btn-group">
        <div class="btn-row">
          <button class="btn btn-success" id="btnStart" onclick="sendCmd('start')" disabled>▶ 启动</button>
          <button class="btn btn-danger"  id="btnStop"  onclick="sendCmd('stop')"  disabled>■ 停止</button>
        </div>
        <button class="btn btn-primary" id="btnListen" onclick="sendCmd('listen')" disabled>
          🎤 手动触发录音
        </button>
        <button class="btn btn-ghost"   id="btnCancel" onclick="sendCmd('cancel')" disabled>
          ✕ 取消录音
        </button>
      </div>
    </div>

    <!-- Runtime config -->
    <div class="card">
      <div class="card-title">运行时配置</div>

      <div class="config-row">
        <label>唤醒词</label>
        <input type="text" id="cfgKeyword" value="hey_jarvis" placeholder="hey_jarvis">
        <button class="btn btn-ghost btn-sm" onclick="applyKeyword()">应用</button>
      </div>

      <div class="config-row">
        <label>灵敏度</label>
        <input type="range" id="cfgSens" min="0.1" max="1.0" step="0.05" value="0.5"
               oninput="document.getElementById('cfgSensVal').textContent=this.value">
        <span class="range-val" id="cfgSensVal">0.5</span>
        <button class="btn btn-ghost btn-sm" onclick="applySensitivity()">应用</button>
      </div>

      <div class="config-row">
        <label>唤醒词</label>
        <label style="width:auto;color:var(--text)">
          <input type="checkbox" id="cfgWWEnabled" checked
                 onchange="sendConfigBool('wake_word.enabled', this.checked)">
          启用
        </label>
      </div>

      <div class="config-row">
        <label>静音超时</label>
        <input type="number" id="cfgSilence" value="1500" min="500" max="5000" step="100">
        <span style="font-size:.75rem;color:var(--muted)">ms</span>
        <button class="btn btn-ghost btn-sm" onclick="applySilenceMs()">应用</button>
      </div>
    </div>

  </div><!-- /left panel -->

  <!-- Transcript -->
  <div class="card transcript-wrap">
    <div class="card-title">识别结果</div>
    <div class="transcript-box" id="transcriptBox">
      <div class="partial-live" id="partialLive"></div>
      <div class="scroll-anchor" id="scrollAnchor"></div>
    </div>
    <div class="transcript-actions">
      <button class="btn btn-ghost btn-sm" onclick="copyTranscripts()">📋 复制全部</button>
      <button class="btn btn-ghost btn-sm" onclick="clearTranscripts()">🗑 清空</button>
    </div>

    <!-- Event log -->
    <div class="card-title" style="margin-top:14px;">事件日志</div>
    <div class="log-box" id="logBox"></div>

    <!-- Raw command input -->
    <div class="raw-row">
      <input id="rawCmd" type="text" placeholder='发送原始命令 JSON，如 {"cmd":"status"}'
             onkeydown="if(event.key==='Enter') sendRaw()">
      <button class="btn btn-ghost btn-sm" onclick="sendRaw()">发送</button>
    </div>
  </div>

</div><!-- /layout -->

<script>
  // ── State ────────────────────────────────────────────────────────────────────
  let ws = null;
  let engineState = 'stopped';
  let transcripts = [];

  // ── Connect / Disconnect ─────────────────────────────────────────────────────
  function toggleConnect() {
    if (ws && ws.readyState <= WebSocket.OPEN) {
      ws.close();
    } else {
      connect();
    }
  }

  function connect() {
    const url = document.getElementById('wsUrl').value.trim();
    setDot('connecting');
    logEvent('system', `连接中 ${url} ...`);

    ws = new WebSocket(url);

    ws.onopen = () => {
      setDot('connected');
      document.getElementById('btnConnect').textContent = '断开';
      logEvent('system', '已连接');
      setControlsEnabled(true);
    };

    ws.onmessage = ({ data }) => {
      let msg;
      try { msg = JSON.parse(data); } catch { return; }
      handleEvent(msg);
    };

    ws.onclose = () => {
      setDot('disconnected');
      document.getElementById('btnConnect').textContent = '连接';
      setControlsEnabled(false);
      setEngineState('stopped');
      logEvent('system', '已断开');
      ws = null;
    };

    ws.onerror = () => {
      setDot('error');
      logEvent('error', '连接错误');
    };
  }

  // ── Send helpers ──────────────────────────────────────────────────────────────
  function sendCmd(cmd) {
    send({ cmd });
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
    }
  }

  function sendRaw() {
    const input = document.getElementById('rawCmd');
    const raw = input.value.trim();
    if (!raw) return;
    try {
      const obj = JSON.parse(raw);
      send(obj);
      input.value = '';
    } catch {
      logEvent('error', '无效 JSON: ' + raw);
    }
  }

  // ── Config senders ────────────────────────────────────────────────────────────
  function applyKeyword() {
    const kw = document.getElementById('cfgKeyword').value.trim();
    if (!kw) return;
    send({ cmd: 'config', key: 'wake_word.keywords', value: [kw] });
  }

  function applySensitivity() {
    const v = parseFloat(document.getElementById('cfgSens').value);
    send({ cmd: 'config', key: 'wake_word.sensitivity', value: v });
  }

  function sendConfigBool(key, value) {
    send({ cmd: 'config', key, value });
  }

  function applySilenceMs() {
    const v = parseInt(document.getElementById('cfgSilence').value, 10);
    send({ cmd: 'config', key: 'asr.max_silence_ms', value: v });
  }

  // ── Event handler ─────────────────────────────────────────────────────────────
  function handleEvent(msg) {
    const { event } = msg;

    // Always log
    logEvent(event, formatEventLog(msg));

    if (event === 'status') {
      setEngineState(msg.state);
      // Sync UI checkboxes
      if (msg.wake_word_enabled !== undefined) {
        document.getElementById('cfgWWEnabled').checked = msg.wake_word_enabled;
      }

    } else if (event === 'wake_word') {
      flashWake(msg.keyword, msg.score);

    } else if (event === 'listening_start') {
      setEngineState('listening');

    } else if (event === 'listening_end') {
      setEngineState('idle');
      clearPartial();

    } else if (event === 'partial') {
      showPartial(msg.text);

    } else if (event === 'transcript') {
      clearPartial();
      addTranscript(msg.text);

    } else if (event === 'config_updated') {
      logEvent('system', `配置已更新: ${msg.key} = ${JSON.stringify(msg.value)}`);

    } else if (event === 'error') {
      logEvent('error', `[${msg.code}] ${msg.message || ''}`);
    }
  }

  // ── UI helpers ────────────────────────────────────────────────────────────────
  function setDot(state) {
    const dot = document.getElementById('dot');
    dot.className = 'dot ' + (state === 'connected' ? 'connected' : state === 'connecting' ? 'connecting' : state === 'error' ? 'error' : '');
  }

  function setEngineState(state) {
    engineState = state;
    const badge = document.getElementById('stateBadge');
    const text  = document.getElementById('stateText');
    const wave  = document.getElementById('wave');

    badge.className = 'state-badge state-' + state;
    text.textContent = { stopped: '已停止', idle: '待机中', listening: '录音中' }[state] || state;
    wave.classList.toggle('active', state === 'listening');

    // Button states
    const connected = ws && ws.readyState === WebSocket.OPEN;
    document.getElementById('btnStart').disabled  = !connected || state !== 'stopped';
    document.getElementById('btnStop').disabled   = !connected || state === 'stopped';
    document.getElementById('btnListen').disabled = !connected || state === 'stopped';
    document.getElementById('btnCancel').disabled = !connected || state !== 'listening';
  }

  function setControlsEnabled(on) {
    ['btnStart','btnStop','btnListen','btnCancel'].forEach(id => {
      document.getElementById(id).disabled = !on;
    });
    if (!on) setEngineState('stopped');
  }

  function flashWake(keyword, score) {
    const el = document.getElementById('wakeIndicator');
    const txt = document.getElementById('wakeText');
    txt.textContent = `检测到唤醒词: ${keyword} (${(score * 100).toFixed(0)}%)`;
    el.classList.remove('flash');
    void el.offsetWidth; // reflow
    el.classList.add('flash');
  }

  function showPartial(text) {
    document.getElementById('partialLive').textContent = text;
  }

  function clearPartial() {
    document.getElementById('partialLive').textContent = '';
  }

  function addTranscript(text) {
    transcripts.push(text);
    const box = document.getElementById('transcriptBox');
    const entry = document.createElement('div');
    entry.className = 'entry final';
    const ts = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    entry.innerHTML = `<span class="ts">${ts}</span><span class="txt">${escHtml(text)}</span>`;
    // Insert before partial/anchor
    box.insertBefore(entry, document.getElementById('partialLive'));
    document.getElementById('scrollAnchor').scrollIntoView({ behavior: 'smooth' });
  }

  function clearTranscripts() {
    transcripts = [];
    const box = document.getElementById('transcriptBox');
    // Remove only .entry elements
    box.querySelectorAll('.entry').forEach(el => el.remove());
    clearPartial();
  }

  function copyTranscripts() {
    if (!transcripts.length) return;
    navigator.clipboard.writeText(transcripts.join('\n'))
      .then(() => logEvent('system', '已复制到剪贴板'));
  }

  // ── Event log ────────────────────────────────────────────────────────────────
  const MAX_LOG_LINES = 200;
  let logLines = 0;

  function logEvent(type, message) {
    const box = document.getElementById('logBox');
    const line = document.createElement('div');
    line.className = `log-line ev-${type}`;
    const ts = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    line.textContent = `[${ts}] ${message}`;
    box.appendChild(line);
    logLines++;
    if (logLines > MAX_LOG_LINES) {
      box.firstChild && box.removeChild(box.firstChild);
    }
    box.scrollTop = box.scrollHeight;
  }

  function formatEventLog(msg) {
    switch (msg.event) {
      case 'status':        return `status: ${msg.state}`;
      case 'wake_word':     return `wake_word: ${msg.keyword} (${(msg.score*100).toFixed(0)}%)`;
      case 'listening_start': return `listening_start [${msg.trigger}]`;
      case 'listening_end':   return `listening_end [${msg.reason}]`;
      case 'partial':       return `partial: ${msg.text}`;
      case 'transcript':    return `transcript: "${msg.text}"`;
      case 'ack':           return `ack: ${msg.cmd}`;
      case 'config_updated': return `config_updated: ${msg.key} = ${JSON.stringify(msg.value)}`;
      case 'error':         return `error [${msg.code}]: ${msg.message || ''}`;
      default:              return JSON.stringify(msg);
    }
  }

  // ── Utils ────────────────────────────────────────────────────────────────────
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  document.getElementById('rawCmd').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendRaw();
  });

  logEvent('system', '就绪，点击「连接」开始。');
</script>
</body>
</html>
