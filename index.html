<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语音识别控制台</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --border:    #2a2d3a;
    --primary:   #4f8ef7;
    --primary-d: #3a70d4;
    --success:   #3ecf8e;
    --danger:    #f76f6f;
    --warn:      #f7b84f;
    --text:      #e2e4ef;
    --muted:     #6b7094;
    --radius:    10px;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: .02em;
    color: #fff;
    margin-bottom: 20px;
  }

  /* ── Layout ──────────────────────────────────────────────────── */
  .layout {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: 290px 1fr;
    grid-template-rows: auto 1fr;
    gap: 14px;
  }
  @media (max-width: 660px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ── Card ────────────────────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .card-title {
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* ── Connection bar ──────────────────────────────────────────── */
  .conn-bar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
  }
  .conn-bar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    color: var(--text);
    font-size: .875rem;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    outline: none;
    min-width: 0;
  }
  .conn-bar input:focus { border-color: var(--primary); }

  /* ── Dot indicator ───────────────────────────────────────────── */
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background .3s;
  }
  .dot.connected  { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .dot.connecting { background: var(--warn);    animation: pulse 1s infinite; }
  .dot.error      { background: var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── Buttons ─────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    border: none; border-radius: 7px; padding: 8px 15px;
    font-size: .875rem; font-weight: 500;
    cursor: pointer; transition: opacity .15s, transform .1s; user-select: none;
    white-space: nowrap;
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-d); }
  .btn-success { background: var(--success); color: #0a2a1e; }
  .btn-success:hover:not(:disabled) { filter: brightness(1.1); }
  .btn-danger  { background: var(--danger);  color: #fff; }
  .btn-danger:hover:not(:disabled)  { filter: brightness(1.1); }
  .btn-ghost   { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-ghost:hover:not(:disabled)   { border-color: var(--text); color: var(--text); }
  .btn-connect { min-width: 80px; }
  .btn-sm      { padding: 4px 9px; font-size: .78rem; }
  .btn-group   { display: flex; flex-direction: column; gap: 8px; }
  .btn-row     { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }

  /* ── State badge ─────────────────────────────────────────────── */
  .state-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px;
    font-size: .78rem; font-weight: 600;
    border: 1px solid transparent; transition: all .3s;
  }
  .state-stopped   { background:#1e1e28; border-color:var(--border);  color:var(--muted); }
  .state-nodevice  { background:#2a1a1a; border-color:var(--danger);  color:var(--danger); }
  .state-idle      { background:#1a2b1e; border-color:var(--success); color:var(--success); }
  .state-listening { background:#1a2240; border-color:var(--primary); color:var(--primary);
                     animation: glow 1.5s ease-in-out infinite; }
  @keyframes glow {
    0%,100%{box-shadow:none}
    50%{box-shadow:0 0 12px rgba(79,142,247,.4)}
  }

  /* ── Waveform (fixed size to avoid layout shift) ─────────────── */
  .wave {
    display: inline-flex; align-items: flex-end; gap: 3px;
    height: 20px; width: 29px; flex-shrink: 0;
  }
  .wave span {
    display: block; width: 3px; border-radius: 2px;
    background: var(--primary);
    transform-origin: bottom;
    transition: opacity .2s;
  }
  .wave span:nth-child(1){height:6px}
  .wave span:nth-child(2){height:12px}
  .wave span:nth-child(3){height:18px}
  .wave span:nth-child(4){height:12px}
  .wave span:nth-child(5){height:6px}
  .wave.inactive span { animation: none; opacity: .15; }
  .wave.active   span { animation: wave-bar 1s ease-in-out infinite; opacity: 1; }
  .wave span:nth-child(1){animation-delay:0s}
  .wave span:nth-child(2){animation-delay:.15s}
  .wave span:nth-child(3){animation-delay:.3s}
  .wave span:nth-child(4){animation-delay:.45s}
  .wave span:nth-child(5){animation-delay:.6s}
  @keyframes wave-bar { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(.25)} }

  /* ── Wake / status indicator ─────────────────────────────────── */
  .status-indicator {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-radius: 8px;
    background: #1a2a1e; border: 1px solid var(--border);
    font-size: .82rem; transition: all .35s;
    margin-bottom: 12px; min-height: 42px;
  }
  .status-indicator.flash {
    background: #1a3d1e; border-color: var(--success);
    animation: flash-in .6s ease-out forwards;
  }
  .status-indicator.no-device {
    background: #2a1a1a; border-color: var(--danger);
  }
  .status-indicator.listening-active {
    background: #1a2240; border-color: var(--primary);
  }
  @keyframes flash-in {
    0%{background:#2a6a3e;border-color:var(--success)}
    100%{background:#1a3d1e;border-color:var(--success)}
  }
  .si-icon { font-size: 1rem; flex-shrink: 0; }

  /* ── Config panel ────────────────────────────────────────────── */
  .config-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .config-row label {
    font-size: .78rem; color: var(--muted); width: 72px; flex-shrink: 0;
  }
  .config-row input[type=text],
  .config-row input[type=number],
  .config-row select {
    flex: 1; min-width: 0;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 8px;
    color: var(--text); font-size: .8rem; outline: none;
  }
  .config-row input:focus,
  .config-row select:focus { border-color: var(--primary); }
  .config-row input[type=range] { flex: 1; accent-color: var(--primary); }
  .range-val { font-size: .78rem; color: var(--muted); min-width: 28px; text-align: right; }
  .config-hint {
    font-size: .72rem; color: var(--muted);
    margin: -4px 0 8px 80px;
    padding: 4px 8px; border-radius: 4px;
    border-left: 2px solid var(--border);
  }

  /* ── Left panel ──────────────────────────────────────────────── */
  .left-panel {
    grid-row: 2;
    grid-column: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  @media (max-width: 660px) {
    .left-panel { grid-column: 1; grid-row: auto; }
  }

  /* ── Transcript area ─────────────────────────────────────────── */
  .transcript-wrap {
    grid-row: 2;
    grid-column: 2;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  @media (max-width: 660px) {
    .transcript-wrap { grid-column: 1; grid-row: auto; }
  }

  .transcript-box {
    flex: 1;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px;
    font-size: .88rem; line-height: 1.75;
    overflow-y: auto; min-height: 200px; max-height: 360px;
  }
  .entry {
    display: flex; gap: 8px; margin-bottom: 6px;
    animation: entry-in .2s ease-out;
  }
  @keyframes entry-in { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
  .entry .ts {
    color: var(--muted); font-size: .72rem; flex-shrink: 0;
    padding-top: 3px; font-family: monospace;
  }
  .entry .txt  { flex: 1; }
  .entry.final .txt { color: var(--text); font-weight: 500; }
  .partial-live {
    color: var(--muted); font-style: italic; min-height: 1.4em; padding: 2px 0;
  }
  .transcript-actions {
    display: flex; justify-content: flex-end; gap: 8px;
  }

  /* ── Event log ───────────────────────────────────────────────── */
  .log-box {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: .72rem; overflow-y: auto; max-height: 150px;
    color: var(--muted);
  }
  .log-line { margin-bottom: 1px; white-space: pre-wrap; word-break: break-all; }
  .log-line.ev-wake_word       { color: var(--success); }
  .log-line.ev-transcript      { color: #7ecfff; }
  .log-line.ev-error           { color: var(--danger); }
  .log-line.ev-listening_start { color: var(--primary); }
  .log-line.ev-system          { color: var(--muted); }

  /* ── Mode hint ───────────────────────────────────────────────── */
  .hint-vosk         { border-color: var(--primary); color: #8ab4f8; }
  .hint-openwakeword { border-color: var(--warn);    color: var(--warn); }
  .hint-auto         { border-color: var(--success); color: var(--success); }

  /* ── Raw send ────────────────────────────────────────────────── */
  .raw-row { display: flex; gap: 8px; }
  .raw-row input {
    flex: 1; min-width: 0;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px;
    color: var(--text); font-family: monospace; font-size: .78rem; outline: none;
  }
  .raw-row input:focus { border-color: var(--primary); }

  .scroll-anchor { height: 1px; }

  /* ── Mode selector hint colours ──────────────────────────────── */
  #modeHint { border-left-width: 2px; }
</style>
</head>
<body>

<h1>&#127908; 语音识别控制台</h1>

<div class="layout">

  <!-- Connection bar -->
  <div class="card conn-bar">
    <div class="dot" id="dot"></div>
    <input id="wsUrl" type="text" value="ws://127.0.0.1:8765" spellcheck="false">
    <button class="btn btn-primary btn-connect" id="btnConnect" onclick="toggleConnect()">连接</button>
  </div>

  <!-- Left panel -->
  <div class="left-panel">

    <!-- Status & controls -->
    <div class="card">
      <div class="card-title">状态与控制</div>

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <span class="state-badge state-stopped" id="stateBadge">
          <span id="stateText">未连接</span>
        </span>
        <div class="wave inactive" id="wave">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="status-indicator" id="statusIndicator">
        <span class="si-icon" id="siIcon">&#128100;</span>
        <span id="siText">就绪，点击「连接」开始。</span>
      </div>

      <div class="btn-group">
        <div class="btn-row">
          <button class="btn btn-success" id="btnStart"  onclick="sendCmd('start')"  disabled>&#9654; 启动</button>
          <button class="btn btn-danger"  id="btnStop"   onclick="sendCmd('stop')"   disabled>&#9632; 停止</button>
        </div>
        <button class="btn btn-primary" id="btnListen" onclick="sendCmd('listen')" disabled>
          &#127908; 手动触发录音
        </button>
        <button class="btn btn-ghost"   id="btnCancel" onclick="sendCmd('cancel')" disabled>
          &#10005; 取消录音
        </button>
      </div>
    </div>

    <!-- Runtime config -->
    <div class="card">
      <div class="card-title">运行时配置</div>

      <div class="config-row">
        <label>检测模式</label>
        <select id="cfgMode" onchange="applyMode()">
          <option value="auto">auto（自动）</option>
          <option value="vosk">vosk（中文自定义）</option>
          <option value="openwakeword">openwakeword（英文）</option>
        </select>
      </div>
      <div id="modeHint" class="config-hint hint-vosk">
        vosk: 语音模型关键词检测，支持任意中文词（如"你好小智"）
      </div>

      <div class="config-row">
        <label>唤醒词</label>
        <input type="text" id="cfgKeyword" value="你好小智" placeholder="你好小智 或 hey_jarvis">
        <button class="btn btn-ghost btn-sm" onclick="applyKeyword()">应用</button>
      </div>
      <div class="config-hint" style="border-color:var(--border)">
        多个词用英文逗号分隔：<code style="color:var(--primary)">你好小智,开始录音</code>
      </div>

      <div class="config-row">
        <label>灵敏度</label>
        <div style="flex:1;min-width:0;display:flex;align-items:center;gap:6px;">
          <input type="range" id="cfgSens" min="0.1" max="1.0" step="0.05" value="0.5"
                 style="flex:1;min-width:0;accent-color:var(--primary)"
                 oninput="document.getElementById('cfgSensVal').textContent=this.value">
          <span class="range-val" id="cfgSensVal">0.5</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="applySensitivity()">应用</button>
      </div>
      <div class="config-hint" style="border-color:var(--border)">
        仅 openwakeword 模式有效
      </div>

      <div class="config-row" style="align-items:flex-start">
        <label style="padding-top:2px">启用</label>
        <label style="flex:1;min-width:0;width:auto;color:var(--text);font-size:.82rem;line-height:1.5;">
          <input type="checkbox" id="cfgWWEnabled" checked
                 onchange="sendConfigBool('wake_word.enabled', this.checked)">
          &nbsp;唤醒词检测（关闭则有声音即开始识别）
        </label>
      </div>

      <div class="config-row" style="margin-top:4px;">
        <label>静音超时</label>
        <input type="number" id="cfgSilence" value="1500" min="500" max="5000" step="100">
        <span style="font-size:.75rem;color:var(--muted)">ms</span>
        <button class="btn btn-ghost btn-sm" onclick="applySilenceMs()">应用</button>
      </div>

    </div><!-- /config card -->

  </div><!-- /left panel -->

  <!-- Right: transcript + log -->
  <div class="card transcript-wrap">
    <div class="card-title">识别结果</div>
    <div class="transcript-box" id="transcriptBox">
      <div class="partial-live" id="partialLive"></div>
      <div class="scroll-anchor" id="scrollAnchor"></div>
    </div>
    <div class="transcript-actions">
      <button class="btn btn-ghost btn-sm" onclick="copyTranscripts()">&#128203; 复制全部</button>
      <button class="btn btn-ghost btn-sm" onclick="clearTranscripts()">&#128465; 清空</button>
    </div>

    <div class="card-title" style="margin-top:12px;">事件日志</div>
    <div class="log-box" id="logBox"></div>

    <div class="raw-row" style="margin-top:8px;">
      <input id="rawCmd" type="text" placeholder='原始 JSON，如 {"cmd":"status"}'
             onkeydown="if(event.key==='Enter')sendRaw()">
      <button class="btn btn-ghost btn-sm" onclick="sendRaw()">发送</button>
    </div>
  </div>

</div><!-- /layout -->

<script>
  // ── State ─────────────────────────────────────────────────────────────────────
  let ws = null;
  let engineState = 'stopped';
  let transcripts = [];

  // ── Connect / disconnect ──────────────────────────────────────────────────────
  function toggleConnect() {
    if (ws && ws.readyState <= WebSocket.OPEN) {
      ws.close();
    } else {
      connect();
    }
  }

  function connect() {
    const url = document.getElementById('wsUrl').value.trim();
    setDot('connecting');
    logEvent('system', '连接中 ' + url + ' ...');

    ws = new WebSocket(url);

    ws.onopen = () => {
      setDot('connected');
      document.getElementById('btnConnect').textContent = '断开';
      logEvent('system', '已连接');
      setControlsEnabled(true);
    };

    ws.onmessage = ({ data }) => {
      let msg;
      try { msg = JSON.parse(data); } catch { return; }
      handleEvent(msg);
    };

    ws.onclose = () => {
      setDot('');
      document.getElementById('btnConnect').textContent = '连接';
      setControlsEnabled(false);
      setEngineState('stopped');
      logEvent('system', '已断开');
      ws = null;
    };

    ws.onerror = () => {
      setDot('error');
      logEvent('error', '连接错误');
    };
  }

  // ── Send helpers ──────────────────────────────────────────────────────────────
  function sendCmd(cmd) { send({ cmd }); }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  function sendRaw() {
    const input = document.getElementById('rawCmd');
    const raw = input.value.trim();
    if (!raw) return;
    try {
      send(JSON.parse(raw));
      input.value = '';
    } catch {
      logEvent('error', '无效 JSON: ' + raw);
    }
  }

  // ── Config senders ────────────────────────────────────────────────────────────
  function applyMode() {
    const mode = document.getElementById('cfgMode').value;
    send({ cmd: 'config', key: 'wake_word.mode', value: mode });
    updateModeHint(mode);
    logEvent('system', '唤醒模式已设为: ' + mode + '（重启引擎后生效）');
  }

  function updateModeHint(mode) {
    const hints = {
      auto:         'auto: 含中文关键词自动用 Vosk，否则用 openwakeword',
      vosk:         'vosk: 语音模型关键词检测，支持任意中文词（如"你好小智"）',
      openwakeword: 'openwakeword: 英文预训练，可用词: hey_jarvis / alexa / hey_mycroft',
    };
    const el = document.getElementById('modeHint');
    el.textContent = hints[mode] || '';
    el.className = 'config-hint hint-' + mode;
  }

  function applyKeyword() {
    const raw = document.getElementById('cfgKeyword').value.trim();
    if (!raw) return;
    const kws = raw.split(',').map(s => s.trim()).filter(Boolean);
    send({ cmd: 'config', key: 'wake_word.keywords', value: kws });
  }

  function applySensitivity() {
    const v = parseFloat(document.getElementById('cfgSens').value);
    send({ cmd: 'config', key: 'wake_word.sensitivity', value: v });
  }

  function sendConfigBool(key, value) { send({ cmd: 'config', key, value }); }

  function applySilenceMs() {
    const v = parseInt(document.getElementById('cfgSilence').value, 10);
    send({ cmd: 'config', key: 'asr.max_silence_ms', value: v });
  }

  // ── Event handler ─────────────────────────────────────────────────────────────
  function handleEvent(msg) {
    const { event } = msg;
    logEvent(event, formatEventLog(msg));

    if (event === 'status') {
      setEngineState(msg.state);
      if (msg.wake_word_enabled !== undefined)
        document.getElementById('cfgWWEnabled').checked = msg.wake_word_enabled;
      if (msg.mode) {
        const sel = document.getElementById('cfgMode');
        if (sel.value !== msg.mode) sel.value = msg.mode;
        updateModeHint(msg.mode);
      }
      if (msg.keywords && msg.keywords.length)
        document.getElementById('cfgKeyword').value = msg.keywords.join(', ');

    } else if (event === 'wake_word') {
      flashWake(msg.keyword, msg.score);

    } else if (event === 'listening_start') {
      setEngineState('listening');

    } else if (event === 'listening_end') {
      setEngineState('idle');
      clearPartial();

    } else if (event === 'partial') {
      showPartial(msg.text);

    } else if (event === 'transcript') {
      clearPartial();
      addTranscript(msg.text);

    } else if (event === 'config_updated') {
      logEvent('system', '配置更新: ' + msg.key + ' = ' + JSON.stringify(msg.value));

    } else if (event === 'error') {
      logEvent('error', '[' + msg.code + '] ' + (msg.message || ''));
      if (msg.code === 'no_device') {
        // Reflect no_device in the indicator without overriding engine state badge
        // (the engine should also emit a status event with state=no_device)
        setSiText('&#128241;', msg.message || '未检测到麦克风');
        document.getElementById('statusIndicator').classList.add('no-device');
      }
    }
  }

  // ── UI helpers ────────────────────────────────────────────────────────────────
  function setDot(state) {
    document.getElementById('dot').className =
      'dot' + (state ? ' ' + state : '');
  }

  const STATE_LABELS = {
    stopped:   '已停止',
    no_device: '无麦克风',
    idle:      '待机中',
    listening: '录音中',
  };

  const STATE_SI = {
    stopped:   ['&#9899;', '服务已停止，点击「启动」开启麦克风。'],
    no_device: ['&#128241;', '未检测到麦克风，每 3 秒自动重试...'],
    idle:      ['&#128066;', '等待唤醒词...'],
    listening: ['&#127908;', '正在录音识别...'],
  };

  function setEngineState(state) {
    engineState = state;
    const badge    = document.getElementById('stateBadge');
    const text     = document.getElementById('stateText');
    const wave     = document.getElementById('wave');
    const indicator= document.getElementById('statusIndicator');

    const cssState = state === 'no_device' ? 'nodevice' : state;
    badge.className = 'state-badge state-' + cssState;
    text.textContent = STATE_LABELS[state] || state;
    wave.className = 'wave ' + (state === 'listening' ? 'active' : 'inactive');

    // Status indicator
    const [icon, hint] = STATE_SI[state] || ['&#9679;', state];
    setSiText(icon, hint);
    indicator.classList.toggle('no-device',         state === 'no_device');
    indicator.classList.toggle('listening-active',  state === 'listening');
    if (state !== 'no_device') indicator.classList.remove('no-device');
    if (state !== 'listening') indicator.classList.remove('listening-active');

    // Button states
    const connected = ws && ws.readyState === WebSocket.OPEN;
    const isStopped = state === 'stopped';
    const isRunning = !isStopped;  // idle, no_device, listening = engine active

    document.getElementById('btnStart').disabled  = !connected || isRunning;
    document.getElementById('btnStop').disabled   = !connected || isStopped;
    document.getElementById('btnListen').disabled = !connected || state !== 'idle';
    document.getElementById('btnCancel').disabled = !connected || state !== 'listening';
  }

  function setSiText(icon, text) {
    document.getElementById('siIcon').innerHTML = icon;
    document.getElementById('siText').textContent = text;
  }

  function setControlsEnabled(on) {
    ['btnStart','btnStop','btnListen','btnCancel'].forEach(id =>
      document.getElementById(id).disabled = !on
    );
    if (!on) setEngineState('stopped');
  }

  function flashWake(keyword, score) {
    setSiText('&#9889;', '检测到唤醒词: ' + keyword + ' (' + (score * 100).toFixed(0) + '%)');
    const el = document.getElementById('statusIndicator');
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  }

  function showPartial(text) {
    document.getElementById('partialLive').textContent = text;
  }

  function clearPartial() {
    document.getElementById('partialLive').textContent = '';
  }

  function addTranscript(text) {
    transcripts.push(text);
    const box   = document.getElementById('transcriptBox');
    const entry = document.createElement('div');
    entry.className = 'entry final';
    const ts = new Date().toLocaleTimeString('zh-CN',
      {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    entry.innerHTML =
      '<span class="ts">' + ts + '</span>' +
      '<span class="txt">' + escHtml(text) + '</span>';
    box.insertBefore(entry, document.getElementById('partialLive'));
    document.getElementById('scrollAnchor').scrollIntoView({ behavior: 'smooth' });
  }

  function clearTranscripts() {
    transcripts = [];
    document.getElementById('transcriptBox')
      .querySelectorAll('.entry').forEach(el => el.remove());
    clearPartial();
  }

  function copyTranscripts() {
    if (!transcripts.length) return;
    navigator.clipboard.writeText(transcripts.join('\n'))
      .then(() => logEvent('system', '已复制到剪贴板'));
  }

  // ── Event log ────────────────────────────────────────────────────────────────
  const MAX_LOG = 200;
  let logCount  = 0;

  function logEvent(type, message) {
    const box  = document.getElementById('logBox');
    const line = document.createElement('div');
    line.className = 'log-line ev-' + type;
    const ts = new Date().toLocaleTimeString('zh-CN', {hour12: false});
    line.textContent = '[' + ts + '] ' + message;
    box.appendChild(line);
    if (++logCount > MAX_LOG && box.firstChild) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }

  function formatEventLog(msg) {
    switch (msg.event) {
      case 'status':          return 'status: ' + msg.state;
      case 'wake_word':       return 'wake_word: ' + msg.keyword + ' (' + (msg.score*100).toFixed(0) + '%)';
      case 'listening_start': return 'listening_start [' + msg.trigger + ']';
      case 'listening_end':   return 'listening_end [' + msg.reason + ']';
      case 'partial':         return 'partial: ' + msg.text;
      case 'transcript':      return 'transcript: "' + msg.text + '"';
      case 'ack':             return 'ack: ' + msg.cmd;
      case 'config_updated':  return 'config_updated: ' + msg.key + ' = ' + JSON.stringify(msg.value);
      case 'error':           return 'error [' + msg.code + ']: ' + (msg.message || '');
      default:                return JSON.stringify(msg);
    }
  }

  // ── Utils ────────────────────────────────────────────────────────────────────
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  updateModeHint(document.getElementById('cfgMode').value);
  logEvent('system', '就绪，点击「连接」开始。');
</script>
</body>
</html>
